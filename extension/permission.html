<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gesture Prompt 카메라 권한</title>
<link rel="stylesheet" href="ui.css">
<body>
  <main class="page">
    <h1>카메라와 문장 처리 안내</h1>
    <div class="card">
      <p>손짓을 인식하기 위해 카메라 영상을 기기에서 처리합니다. 영상은 서버로 보내지 않습니다.</p>
      <p>손짓으로 말투를 바꿀 때만 현재 입력칸의 문장을 Firebase 서버로 보내고, 서버에서 OpenAI API로 전달합니다. 원문과 결과는 이 브라우저 세션에 임시 저장됩니다. 바뀐 문장은 확인 후 직접 전송합니다.</p>
      <p>문장에 개인정보나 비밀번호를 넣지 마세요. 자세한 내용은 <a href="https://github.com/meoyaho/ai-world/blob/main/PRIVACY.md" target="_blank" rel="noopener noreferrer">개인정보 처리방침</a>에서 확인할 수 있습니다.</p>
      <div class="actions">
        <button class="button" type="button" id="allow">위 내용에 동의하고 카메라 허용하기</button>
        <span class="saved" id="result" role="status" aria-live="polite"></span>
      </div>
    </div>
  </main>
  <script type="module" src="permission.js"></script>
</body>
</html>
