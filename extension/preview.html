<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>Gesture Prompt 미리보기</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d1d1f; color: #fff; }
  .stage { position: relative; width: 100%; height: 100%; }
  /* 거울처럼 보이도록 영상과 관절 표시를 함께 뒤집는다. */
  .mirror { position: absolute; inset: 0; transform: scaleX(-1); }
  .mirror img, .mirror canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .waiting { position: absolute; inset: 0; display: grid; place-items: center; padding: 12px; color: #a1a1a6; font-size: 12px; text-align: center; }
  .readout {
    position: absolute; left: 6px; right: 6px; bottom: 6px;
    display: grid; gap: 5px; padding: 6px 8px; border-radius: 8px;
    background: rgba(0, 0, 0, .62); font-size: 12px; font-weight: 600; line-height: 1.35;
  }
  .meter { height: 3px; overflow: hidden; border-radius: 2px; background: rgba(255, 255, 255, .25); }
  .meter span { display: block; width: 0; height: 100%; background: #34c759; transition: width .1s linear; }
  .stage[data-gesture=""] .meter span { background: #fff; }
  [hidden] { display: none !important; }
</style>
<body>
  <div class="stage" id="stage" data-gesture="">
    <div class="mirror">
      <img id="frame" alt="">
      <canvas id="landmarks" width="320" height="240"></canvas>
    </div>
    <p class="waiting" id="waiting">카메라를 켜는 중…</p>
    <div class="readout" id="readout" hidden>
      <span id="label" role="status">손을 찾는 중…</span>
      <span class="meter" aria-hidden="true"><span id="hold"></span></span>
    </div>
  </div>
  <script type="module" src="preview.js"></script>
</body>
</html>
