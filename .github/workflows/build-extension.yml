name: Build Chrome extension

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v0.2.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build extension ZIP
        run: sh build-extension.sh
      - name: Check manifest and bundled files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"
          unzip -l dist/GesturePrompt-chrome.zip | grep -E 'manifest.json|vendor/gesture_recognizer.task|vendor/wasm/vision_wasm_internal.wasm'
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: dist/GesturePrompt-chrome.zip
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Select and validate version
        id: version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RELEASE_VERSION="$GITHUB_REF_NAME"
          else
            RELEASE_VERSION="$MANUAL_VERSION"
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Use a version such as v0.2.0.' >&2
            exit 1
          fi
          echo "value=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: chrome-extension
          path: downloads
      - name: Create draft release with extension
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "$RELEASE_VERSION" downloads/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_VERSION" \
            --generate-notes \
            --draft
