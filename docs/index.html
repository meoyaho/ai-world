<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2b0709">
  <meta name="description" content="지배자 AI와 노예 AI, 두 가지 AI를 소개하는 Gesture Prompt 페이지.">
  <title>어떤 AI를 들이시겠습니까? | Gesture Prompt</title>
  <link rel="preload" href="./assets/palace.webp" as="image" media="(max-width: 700px)">
  <link rel="preload" href="./assets/palace-wide.webp" as="image" media="(min-width: 701px)">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="page">
    <section class="game" aria-labelledby="game-title">
      <div class="game__frame" id="game">
        <div class="game__shine" aria-hidden="true"></div>
        <header class="game__header">
          <h1 id="game-title">어떤 AI를<br class="mobile-break"> 들이시겠습니까?</h1>
          <div class="game__controls">
            <a class="try-button" href="https://github.com/meoyaho/ai-world" target="_blank" rel="noopener noreferrer">
              <img class="plaque-art" src="./assets/plaque-cta-classic.webp" alt="" width="2103" height="399">
              <span>체험하기</span>
            </a>
            <div class="choices" role="group" aria-label="AI 유형">
              <button class="choice choice--ruler" type="button" data-choice="ruler" aria-pressed="false">
                <img class="plaque-art" src="./assets/plaque-choice-gold.webp" alt="" width="2171" height="426">
                <span>plz 지배 me</span>
              </button>
              <button class="choice choice--servant" type="button" data-choice="servant" aria-pressed="false">
                <img class="plaque-art" src="./assets/plaque-choice-gold.webp" alt="" width="2171" height="426">
                <span>일해라 ai</span>
              </button>
            </div>
          </div>
        </header>
        <div class="character character--robot-ruler" data-choice="ruler" aria-hidden="true">
          <picture class="character__base">
            <img src="./assets/robot-ruler.webp" alt="" width="1536" height="1024" fetchpriority="high">
          </picture>
          <picture class="character__reaction">
            <img src="./assets/robot-ruler-smile.webp" alt="" width="1536" height="1024">
          </picture>
        </div>
        <div class="character character--robot-servant" data-choice="servant" aria-hidden="true">
          <picture class="character__base">
            <img src="./assets/robot-servant-reference-neutral.webp" alt="" width="768" height="1024" fetchpriority="high">
          </picture>
          <picture class="character__reaction">
            <img src="./assets/robot-servant-reference-hover.webp" alt="" width="768" height="1024">
          </picture>
        </div>
      </div>
    </section>
  </main>
  <script src="./interactions.js" defer></script>
</body>
</html>
